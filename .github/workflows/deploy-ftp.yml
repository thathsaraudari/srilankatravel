name: Deploy to InfinityFree

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wp-content/plugins/slt-core/**'
      - 'wp-content/themes/slt-travel/**'
      - 'wp-content/mu-plugins/**'
      - 'health/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy bootstrap
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftpupload.net
          username: if0_43111316
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./wp-content/mu-plugins/
          server-dir: /htdocs/wp-content/mu-plugins/
          dangerous-clean-slate: false

      - name: Deploy SLT plugin
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftpupload.net
          username: if0_43111316
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./wp-content/plugins/slt-core/
          server-dir: /htdocs/wp-content/plugins/slt-core/
          dangerous-clean-slate: false

      - name: Deploy SLT theme
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftpupload.net
          username: if0_43111316
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./wp-content/themes/slt-travel/
          server-dir: /htdocs/wp-content/themes/slt-travel/
          dangerous-clean-slate: false

      - name: Deploy static health probe
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftpupload.net
          username: if0_43111316
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./health/
          server-dir: /htdocs/
          dangerous-clean-slate: false

      - name: Bootstrap and smoke-test WordPress
        shell: bash
        run: |
          set -e
          for i in 1 2 3 4; do
            curl -L --silent --show-error --max-time 30 https://srilankatravel-demo.freehosting.dev/ >/dev/null || true
            sleep 2
          done
          static_code=$(curl -L --silent --output /dev/null --write-out "%{http_code}" --max-time 30 https://srilankatravel-demo.freehosting.dev/slt-health.txt || true)
          wp_code=$(curl -L --silent --output /dev/null --write-out "%{http_code}" --max-time 30 https://srilankatravel-demo.freehosting.dev/ || true)
          echo "Static health HTTP status: $static_code"
          echo "WordPress homepage HTTP status: $wp_code"
