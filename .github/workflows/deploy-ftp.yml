name: Deploy to InfinityFree

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wp-content/plugins/slt-core/**'
      - 'wp-content/themes/slt-travel/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy SLT plugin
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./wp-content/plugins/slt-core/
          server-dir: ${{ secrets.FTP_REMOTE_PATH }}wp-content/plugins/slt-core/
          dangerous-clean-slate: false

      - name: Deploy SLT theme
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./wp-content/themes/slt-travel/
          server-dir: ${{ secrets.FTP_REMOTE_PATH }}wp-content/themes/slt-travel/
          dangerous-clean-slate: false
